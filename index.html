<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReciclaTech</title>

    <!-- Google Fonts (Inter e Poppins) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS compilado do SCSS -->
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>

  <body>
    <!-- ========== HEADER ========== -->
    <header class="site-header" role="banner">
      <div class="site-header__wrap">
        <a href="/" class="site-header__brand">
          <img
            src="src/img/logo.svg"
            alt="ReciclaTech"
            class="site-header__logo"
          />
          <!-- título visual, não estrutural -->
          <span class="site-header__title" aria-hidden="true">ReciclaTech</span>
        </a>

        <nav class="site-header__nav" aria-label="Navegação principal">
          <ul class="site-header__list" role="list">
            <li>
              <a class="site-header__link" href="#como-funciona"
                >Como funciona</a
              >
            </li>
            <li><a class="site-header__link" href="#doar">Doar</a></li>
            <li><a class="site-header__link" href="#adquirir">Adquirir</a></li>
          </ul>
          <a class="btn--solid-green site-header__btn" href="#entrar"
            >Começar Agora</a
          >
        </nav>
      </div>
    </header>

    <!-- ========== Hero Section ========== -->
    <section class="hero" id="inicio" aria-labelledby="hero-title">
      <div class="hero__wrap">
        <div class="hero__content">
          <h1 id="hero-title" class="hero__title">
            Dê uma segunda vida aos seus eletrônicos!
          </h1>

          <p class="hero__subtitle">
            Conectamos pessoas que querem doar eletrônicos em bom estado com
            quem precisa deles. Simples, gratuito e sustentável!
          </p>

          <div class="hero__actions">
            <a
              href="#doar"
              class="btn btn--solid-green hero__btn"
              aria-label="Quero doar"
            >
              <img
                src="src/img/icon-gift.svg"
                alt=""
                aria-hidden="true"
                class="hero__btn-icon"
              />
              <span>Quero doar</span>
            </a>

            <a
              href="#adquirir"
              class="btn btn--outline hero__btn"
              aria-label="Quero adquirir"
            >
              <span>Quero Adquirir</span>
              <img
                src="src/img/icon-heart.svg"
                alt=""
                aria-hidden="true"
                class="hero__btn-icon"
              />
            </a>
          </div>
        </div>

        <figure class="hero__media">
          <img
            src="src/img/hero-recycle.png"
            alt="Símbolo de reciclagem formado por placas eletrônicas"
            class="hero__image"
          />
        </figure>
      </div>
    </section>
  </body>
</html>
